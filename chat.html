<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат - Открой последний чат</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            display: flex;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 1200px;
            height: 80vh;
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background: #f8f9fa;
            border-right: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background: #667eea;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            font-size: 1.2em;
        }

        .open-last-chat-btn {
            background: #764ba2;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s ease;
        }

        .open-last-chat-btn:hover {
            background: #5a3880;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .chat-item {
            padding: 15px;
            margin-bottom: 5px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .chat-item:hover {
            background: #e9ecef;
        }

        .chat-item.active {
            background: #667eea;
            color: white;
        }

        .chat-item-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .chat-item-preview {
            font-size: 0.9em;
            color: #6c757d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item.active .chat-item-preview {
            color: rgba(255, 255, 255, 0.8);
        }

        .chat-item-time {
            font-size: 0.8em;
            color: #adb5bd;
            margin-top: 5px;
        }

        .chat-item.active .chat-item-time {
            color: rgba(255, 255, 255, 0.7);
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #dee2e6;
            background: white;
        }

        .chat-header h3 {
            color: #667eea;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
        }

        .message.sent {
            flex-direction: row-reverse;
        }

        .message-content {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message.sent .message-content {
            background: #667eea;
            color: white;
        }

        .message-time {
            font-size: 0.75em;
            color: #6c757d;
            margin-top: 5px;
        }

        .message.sent .message-time {
            color: rgba(255, 255, 255, 0.7);
        }

        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #dee2e6;
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            border: 1px solid #dee2e6;
            border-radius: 25px;
            outline: none;
            font-size: 1em;
        }

        .chat-input input:focus {
            border-color: #667eea;
        }

        .chat-input button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s ease;
        }

        .chat-input button:hover {
            background: #5568d3;
        }

        .no-chat-selected {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6c757d;
            font-size: 1.2em;
        }

        .new-chat-btn {
            margin: 10px;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s ease;
        }

        .new-chat-btn:hover {
            background: #5568d3;
        }

        @media (max-width: 768px) {
            .container {
                height: 90vh;
            }

            .sidebar {
                width: 100%;
                position: absolute;
                z-index: 10;
                height: 100%;
            }

            .sidebar.hidden {
                display: none;
            }

            .message-content {
                max-width: 80%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Чаты</h2>
                <button class="open-last-chat-btn" id="openLastChatBtn" title="Открыть последний чат">
                    📋 Последний
                </button>
            </div>
            <button class="new-chat-btn" id="newChatBtn">+ Новый чат</button>
            <div class="chat-list" id="chatList"></div>
        </div>

        <div class="chat-main">
            <div class="chat-header" id="chatHeader" style="display: none;">
                <h3 id="currentChatName"></h3>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="no-chat-selected" id="noChatSelected">
                    Выберите чат или создайте новый
                </div>
            </div>
            <div class="chat-input" id="chatInput" style="display: none;">
                <input type="text" id="messageInput" placeholder="Введите сообщение...">
                <button id="sendBtn">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        class ChatApp {
            constructor() {
                this.chats = this.loadChats();
                this.currentChatId = null;
                this.initializeElements();
                this.attachEventListeners();
                this.renderChatList();
                
                // If there are chats, optionally open the last one on load
                if (this.chats.length > 0) {
                    // Don't auto-open, let user click the button
                    console.log('Есть чаты. Нажмите "Последний" чтобы открыть последний чат.');
                }
            }

            initializeElements() {
                this.chatList = document.getElementById('chatList');
                this.chatMessages = document.getElementById('chatMessages');
                this.chatHeader = document.getElementById('chatHeader');
                this.chatInput = document.getElementById('chatInput');
                this.currentChatName = document.getElementById('currentChatName');
                this.messageInput = document.getElementById('messageInput');
                this.noChatSelected = document.getElementById('noChatSelected');
            }

            attachEventListeners() {
                document.getElementById('newChatBtn').addEventListener('click', () => this.createNewChat());
                document.getElementById('sendBtn').addEventListener('click', () => this.sendMessage());
                document.getElementById('openLastChatBtn').addEventListener('click', () => this.openLastChat());
                this.messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.sendMessage();
                    }
                });
            }

            loadChats() {
                const savedChats = localStorage.getItem('chats');
                return savedChats ? JSON.parse(savedChats) : [];
            }

            saveChats() {
                localStorage.setItem('chats', JSON.stringify(this.chats));
            }

            createNewChat() {
                const chatName = prompt('Введите название чата:');
                if (!chatName) return;

                const newChat = {
                    id: Date.now(),
                    name: chatName,
                    messages: [],
                    lastMessageTime: new Date().toISOString()
                };

                this.chats.unshift(newChat);
                this.saveChats();
                this.renderChatList();
                this.openChat(newChat.id);
            }

            openLastChat() {
                if (this.chats.length === 0) {
                    alert('Нет доступных чатов. Создайте новый чат!');
                    return;
                }

                // Sort chats by last message time (most recent first)
                const sortedChats = [...this.chats].sort((a, b) => 
                    new Date(b.lastMessageTime) - new Date(a.lastMessageTime)
                );

                // Open the most recent chat
                const lastChat = sortedChats[0];
                this.openChat(lastChat.id);
                
                // Show notification
                this.showNotification(`Открыт последний чат: "${lastChat.name}"`);
            }

            showNotification(message) {
                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: #667eea;
                    color: white;
                    padding: 15px 25px;
                    border-radius: 8px;
                    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                    z-index: 1000;
                    animation: slideIn 0.3s ease;
                `;
                notification.textContent = message;
                document.body.appendChild(notification);

                setTimeout(() => {
                    notification.style.animation = 'slideOut 0.3s ease';
                    setTimeout(() => notification.remove(), 300);
                }, 3000);
            }

            openChat(chatId) {
                this.currentChatId = chatId;
                const chat = this.chats.find(c => c.id === chatId);
                
                if (!chat) return;

                this.currentChatName.textContent = chat.name;
                this.noChatSelected.style.display = 'none';
                this.chatHeader.style.display = 'block';
                this.chatInput.style.display = 'flex';

                this.renderMessages(chat.messages);
                this.renderChatList(); // Re-render to update active state
            }

            renderMessages(messages) {
                this.chatMessages.innerHTML = '';
                
                messages.forEach(msg => {
                    const messageDiv = document.createElement('div');
                    messageDiv.className = `message ${msg.sent ? 'sent' : 'received'}`;
                    
                    messageDiv.innerHTML = `
                        <div class="message-content">
                            <div>${msg.text}</div>
                            <div class="message-time">${this.formatTime(msg.timestamp)}</div>
                        </div>
                    `;
                    
                    this.chatMessages.appendChild(messageDiv);
                });

                this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
            }

            sendMessage() {
                const text = this.messageInput.value.trim();
                if (!text || !this.currentChatId) return;

                const chat = this.chats.find(c => c.id === this.currentChatId);
                if (!chat) return;

                const message = {
                    text: text,
                    timestamp: new Date().toISOString(),
                    sent: true
                };

                chat.messages.push(message);
                chat.lastMessageTime = message.timestamp;
                
                this.saveChats();
                this.renderMessages(chat.messages);
                this.renderChatList();
                this.messageInput.value = '';

                // Simulate a response
                setTimeout(() => {
                    const response = {
                        text: 'Спасибо за сообщение! Это автоматический ответ.',
                        timestamp: new Date().toISOString(),
                        sent: false
                    };
                    chat.messages.push(response);
                    chat.lastMessageTime = response.timestamp;
                    this.saveChats();
                    this.renderMessages(chat.messages);
                    this.renderChatList();
                }, 1000);
            }

            renderChatList() {
                this.chatList.innerHTML = '';
                
                // Sort chats by last message time
                const sortedChats = [...this.chats].sort((a, b) => 
                    new Date(b.lastMessageTime) - new Date(a.lastMessageTime)
                );

                sortedChats.forEach(chat => {
                    const chatItem = document.createElement('div');
                    chatItem.className = `chat-item ${chat.id === this.currentChatId ? 'active' : ''}`;
                    
                    const lastMessage = chat.messages.length > 0 
                        ? chat.messages[chat.messages.length - 1].text 
                        : 'Нет сообщений';
                    
                    chatItem.innerHTML = `
                        <div class="chat-item-name">${chat.name}</div>
                        <div class="chat-item-preview">${lastMessage}</div>
                        <div class="chat-item-time">${this.formatTime(chat.lastMessageTime)}</div>
                    `;
                    
                    chatItem.addEventListener('click', () => this.openChat(chat.id));
                    this.chatList.appendChild(chatItem);
                });
            }

            formatTime(timestamp) {
                const date = new Date(timestamp);
                const now = new Date();
                const diffMs = now - date;
                const diffMins = Math.floor(diffMs / 60000);
                const diffHours = Math.floor(diffMs / 3600000);
                const diffDays = Math.floor(diffMs / 86400000);

                if (diffMins < 1) return 'Только что';
                if (diffMins < 60) return `${diffMins} мин назад`;
                if (diffHours < 24) return `${diffHours} ч назад`;
                if (diffDays < 7) return `${diffDays} д назад`;
                
                return date.toLocaleDateString('ru-RU', { 
                    day: 'numeric', 
                    month: 'short' 
                });
            }
        }

        // Add animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }

            @keyframes slideOut {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(100%);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Initialize the app
        const app = new ChatApp();
    </script>
</body>
</html>
